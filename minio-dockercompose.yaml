version: '3.8'

services:

  minio:
    image: minio/minio:latest
    container_name: test-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "7000:9000"  # S3 API endpoint
      - "7001:9001"  # Web console
    volumes:
      - minio_data:/data  # Persist S3 object data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO setup - Creates the backup bucket automatically
  # This runs once during startup and exits
  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:7000 minioadmin minioadmin;
      mc mb myminio/minio-test-bucket --ignore-existing;
      echo 'MinIO bucket created successfully';
      "

  
volumes:  
  minio_data: