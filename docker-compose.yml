version: '3.8'

services:

  # ── S3-compatible object storage ──────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: s3candles-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '5'

  # ── One-shot init: create bucket & seed config CSV ────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: s3candles-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./kraken-collector-config.csv:/tmp/kraken-collector-config.csv:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/candles-data --ignore-existing;
      mc stat myminio/candles-data/config/kraken-collector-config.csv > /dev/null 2>&1 || \
        mc cp /tmp/kraken-collector-config.csv myminio/candles-data/config/kraken-collector-config.csv;
      echo 'Bucket ready, config CSV seeded';
      "

  # ── Candles HTTP API ──────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: s3candles-api
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    ports:
      - "5044:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      S3Candles__Bucket: candles-data
      S3Candles__Prefix: candles
      S3Candles__AWS__AccessKey: minioadmin
      S3Candles__AWS__SecretKey: minioadmin
      S3Candles__AWS__Region: us-east-1
      S3Candles__AWS__Url: http://minio:9000
    deploy:
      resources:
        limits:
          cpus: '5'
        #   memory: 500m
        # reservations:
        #   memory: 500m

  # ── CSV → binary candle loader (long-running background service) ──────
  csv-loader:
    build:
      context: .
      dockerfile: Dockerfile.csv-loader
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    ports:
      - "5045:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      S3Candles__Bucket: candles-data
      S3Candles__Prefix: candles
      S3Candles__AWS__AccessKey: minioadmin
      S3Candles__AWS__SecretKey: minioadmin
      S3Candles__AWS__Region: us-east-1
      S3Candles__AWS__Url: http://minio:9000

  # ── Kraken OHLCV collector (one-shot batch job) ──────────────────────
  # kraken-collector:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.collector
  #   depends_on:
  #     minio-setup:
  #       condition: service_completed_successfully
  #   ports:
  #     - "5099:8080"
  #   restart: "no"
  #   environment:
  #     ASPNETCORE_ENVIRONMENT: Production
  #     S3Candles__Bucket: candles-data
  #     S3Candles__Prefix: candles
  #     S3Candles__AWS__AccessKey: minioadmin
  #     S3Candles__AWS__SecretKey: minioadmin
  #     S3Candles__AWS__Region: us-east-1
  #     S3Candles__AWS__Url: http://minio:9000

  # ── Kraken historical importer (one-shot batch job) ──────────────────
  # kraken-historical-importer:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.historical-importer
  #   depends_on:
  #     minio-setup:
  #       condition: service_completed_successfully
  #   restart: "no"
  #   volumes:
  #     - historical_downloads:/tmp/kraken-historical
  #   environment:
  #     ASPNETCORE_ENVIRONMENT: Production
  #     S3Candles__Bucket: candles-data
  #     S3Candles__AWS__AccessKey: minioadmin
  #     S3Candles__AWS__SecretKey: minioadmin
  #     S3Candles__AWS__Region: us-east-1
  #     S3Candles__AWS__Url: http://minio:9000
  #     HistoricalImport__TempDirectory: /tmp/kraken-historical
  #     HistoricalImport__GoogleApiKey: ${GOOGLE_API_KEY:?Set GOOGLE_API_KEY env var}

  # ── k6 stress test (opt-in via: docker compose --profile stress up k6-stress) ──
  k6-stress:
    build:
      context: ./S3CandlesDemo.StressTests
      dockerfile: Dockerfile
    container_name: s3candles-k6-stress
    profiles:
      - stress
    depends_on:
      - api
    restart: "no"
    ports:
      - "5665:5665"   # k6 web dashboard → http://localhost:5665
    environment:
      BASE_URL: http://api:8080
      SYMBOL: "BTC/USDT"
      INTERVAL: "1"
      FROM: "2024-05-01T00:00:00Z"
      TO: "2024-05-05T00:00:00Z"
      MAX_VUS: "2000"
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_OPEN: "false"
    deploy:
      resources:
        limits:
          cpus: '4'

  # ── Portainer — Docker management UI ──────────────────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    container_name: s3candles-portainer
    restart: unless-stopped
    ports:
      - "8000:8000"   # Edge agent tunnel
      - "9443:9443"   # HTTPS UI → https://localhost:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  minio_data:
  historical_downloads:
  portainer_data:
