version: '3.8'

services:

  # ── S3-compatible object storage ──────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: s3candles-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── One-shot init: create buckets & seed config CSV ──────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: s3candles-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./S3CandlesDemo.KrakenLatestCollector/kraken-collector-config.csv:/tmp/kraken-collector-config.csv:ro
      - ./S3CandlesDemo.KrakenHistoricalImporter/kraken-historical-config.csv:/tmp/kraken-historical-config.csv:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/candles-data --ignore-existing;
      mc mb myminio/candles-config --ignore-existing;
      mc stat myminio/candles-config/kraken-collector-config.csv > /dev/null 2>&1 || \
        mc cp /tmp/kraken-collector-config.csv myminio/candles-config/kraken-collector-config.csv;
      mc stat myminio/candles-config/kraken-historical-config.csv > /dev/null 2>&1 || \
        mc cp /tmp/kraken-historical-config.csv myminio/candles-config/kraken-historical-config.csv;
      echo 'Buckets ready, config CSVs seeded';
      "

  # ── Candles HTTP API ──────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: s3candles-api
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    ports:
      - "5044:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      S3Candles__Bucket: candles-data
      S3Candles__Prefix: candles
      S3Candles__AWS__AccessKey: minioadmin
      S3Candles__AWS__SecretKey: minioadmin
      S3Candles__AWS__Region: us-east-1
      S3Candles__AWS__Url: http://minio:9000

  # ── Kraken OHLCV collector (one-shot batch job) ──────────────────────
  kraken-collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    container_name: s3candles-collector
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    ports:
      - "5099:8080"
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      S3Candles__Bucket: candles-data
      S3Candles__Prefix: candles
      S3Candles__AWS__AccessKey: minioadmin
      S3Candles__AWS__SecretKey: minioadmin
      S3Candles__AWS__Region: us-east-1
      S3Candles__AWS__Url: http://minio:9000
      S3Candles__ConfigBucket: candles-config
      S3Candles__ConfigKey: kraken-collector-config.csv

  # ── Kraken historical importer (one-shot batch job) ──────────────────
  kraken-historical-importer:
    build:
      context: .
      dockerfile: Dockerfile.historical-importer
    container_name: s3candles-historical-importer
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    restart: "no"
    volumes:
      - historical_downloads:/tmp/kraken-historical
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      S3Candles__Bucket: candles-data
      S3Candles__Prefix: candles
      S3Candles__AWS__AccessKey: minioadmin
      S3Candles__AWS__SecretKey: minioadmin
      S3Candles__AWS__Region: us-east-1
      S3Candles__AWS__Url: http://minio:9000
      S3Candles__ConfigBucket: candles-config
      S3Candles__ConfigKey: kraken-historical-config.csv
      HistoricalImport__TempDirectory: /tmp/kraken-historical
      HistoricalImport__GoogleApiKey: ${GOOGLE_API_KEY:?Set GOOGLE_API_KEY env var}

volumes:
  minio_data:
  historical_downloads:
