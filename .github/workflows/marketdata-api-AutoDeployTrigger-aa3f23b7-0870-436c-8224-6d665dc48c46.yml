name: Trigger auto deployment for marketdata-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - 'Dockerfile.api'
    - 'S3CandlesDemo.Api/**'
    - 'S3CandlesDemo.Candles/**'
    - '.github/workflows/marketdata-api-AutoDeployTrigger-aa3f23b7-0870-436c-8224-6d665dc48c46.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MARKETDATAAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MARKETDATAAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MARKETDATAAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Generate image tag
        id: image-tag
        run: |
          TAG="${{ github.sha }}-$(date +%s)"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG}"

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        run: |
          az acr login --name marketdataacr

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.api \
            -t marketdataacr.azurecr.io/marketdata-api:${{ steps.image-tag.outputs.tag }} \
            -t marketdataacr.azurecr.io/marketdata-api:latest \
            .

      - name: Push image to ACR
        run: |
          docker push marketdataacr.azurecr.io/marketdata-api:${{ steps.image-tag.outputs.tag }}
          docker push marketdataacr.azurecr.io/marketdata-api:latest

      - name: Update Container App with new image
        run: |
          echo "Deploying image: marketdataacr.azurecr.io/marketdata-api:${{ steps.image-tag.outputs.tag }}"
          CONTAINER_NAME=$(az containerapp show \
            --name marketdata-api \
            --resource-group marketdata-rg \
            --query "properties.template.containers[0].name" \
            -o tsv)

          if [ -z "$CONTAINER_NAME" ]; then
            CONTAINER_NAME="marketdata-api"
          fi

          echo "Using container name: ${CONTAINER_NAME}"
          az containerapp update \
            --name marketdata-api \
            --resource-group marketdata-rg \
            --container-name "${CONTAINER_NAME}" \
            --image marketdataacr.azurecr.io/marketdata-api:${{ steps.image-tag.outputs.tag }}
          echo "Container App updated successfully with image tag: ${{ steps.image-tag.outputs.tag }}"


